name: "CI - Pull Request: Build, Test & Lint"

on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: Debug
      checkout_pr:
        type: string
        description: Checkout PR
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Switch to relevant PR
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./.github/scripts/get_pr.sh

      - name: Install zizmor
        run: |
          pipx install zizmor

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        run: |
          npm run build

      - name: Build or restore Docker test images
        uses: $/.github/actions/build-all-test-images

      - name: Test
        env:
          DEBUG: ${{ github.event.inputs.debug }}
        run: |
          npm run test

      - name: Lint code
        run: |
          npm run lint:all
        if: github.event.inputs.checkout_pr == ''

      - name: Lint commit
        run: |
          if [[ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]]; then
            npx commitlint --to HEAD --verbose
          else
            npx commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        if: github.event.inputs.checkout_pr == ''

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Switch to relevant PR
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./.github/scripts/get_pr.sh

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        run: |
          npm run build

      - name: Build or restore Docker test images
        uses: $/.github/actions/build-all-test-images

      - name: Test
        env:
          DEBUG: ${{ github.event.inputs.debug }}
        run: |
          npm run test -- --run test/fixtures.test.ts
